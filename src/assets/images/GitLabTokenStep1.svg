<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Open repository settings</title>
<desc id="desc">Select your script repository. Open Settings, then Access Tokens.</desc>
<rect width="1000" height="420" rx="16" fill="#18212f"/>
<text x="48" y="60" fill="#a7b7cf" font-family="sans-serif" font-size="18">K6R / SETUP EXAMPLE</text>
<text x="48" y="120" fill="#ffffff" font-family="sans-serif" font-size="32">Open repository settings</text>
<text x="48" y="190" fill="#d4deed" font-family="sans-serif" font-size="22">Select your script repository.</text>
<text x="48" y="238" fill="#d4deed" font-family="sans-serif" font-size="22">Open Settings, then Access Tokens.</text>
<text x="48" y="382" fill="#a7b7cf" font-family="sans-serif" font-size="16">Illustrative example. Use your own environment values.</text>
</svg>
