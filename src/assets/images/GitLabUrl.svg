<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Repository URL</title>
<desc id="desc">Open your script repository. Copy its HTTPS URL from the address bar. Example: https://gitlab.example.com/group/repo-name</desc>
<rect width="1000" height="420" rx="16" fill="#18212f"/>
<text x="48" y="60" fill="#a7b7cf" font-family="sans-serif" font-size="18">K6R / SETUP EXAMPLE</text>
<text x="48" y="120" fill="#ffffff" font-family="sans-serif" font-size="32">Repository URL</text>
<text x="48" y="190" fill="#d4deed" font-family="sans-serif" font-size="22">Open your script repository.</text>
<text x="48" y="238" fill="#d4deed" font-family="sans-serif" font-size="22">Copy its HTTPS URL from the address bar.</text>
<text x="48" y="286" fill="#d4deed" font-family="sans-serif" font-size="22">Example: https://gitlab.example.com/group/repo-name</text>
<text x="48" y="382" fill="#a7b7cf" font-family="sans-serif" font-size="16">Illustrative example. Use your own environment values.</text>
</svg>
