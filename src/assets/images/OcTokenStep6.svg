<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Copy the service account token</title>
<desc id="desc">Copy the token field into k6r settings. Token value: YOUR_OPENSHIFT_TOKEN Keep the real token private.</desc>
<rect width="1000" height="420" rx="16" fill="#18212f"/>
<text x="48" y="60" fill="#a7b7cf" font-family="sans-serif" font-size="18">K6R / SETUP EXAMPLE</text>
<text x="48" y="120" fill="#ffffff" font-family="sans-serif" font-size="32">Copy the service account token</text>
<text x="48" y="190" fill="#d4deed" font-family="sans-serif" font-size="22">Copy the token field into k6r settings.</text>
<text x="48" y="238" fill="#d4deed" font-family="sans-serif" font-size="22">Token value: YOUR_OPENSHIFT_TOKEN</text>
<text x="48" y="286" fill="#d4deed" font-family="sans-serif" font-size="22">Keep the real token private.</text>
<text x="48" y="382" fill="#a7b7cf" font-family="sans-serif" font-size="16">Illustrative example. Use your own environment values.</text>
</svg>
