<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Create a service account</title>
<desc id="desc">Select Create ServiceAccount. Name: k6-runner Namespace: your-namespace</desc>
<rect width="1000" height="420" rx="16" fill="#18212f"/>
<text x="48" y="60" fill="#a7b7cf" font-family="sans-serif" font-size="18">K6R / SETUP EXAMPLE</text>
<text x="48" y="120" fill="#ffffff" font-family="sans-serif" font-size="32">Create a service account</text>
<text x="48" y="190" fill="#d4deed" font-family="sans-serif" font-size="22">Select Create ServiceAccount.</text>
<text x="48" y="238" fill="#d4deed" font-family="sans-serif" font-size="22">Name: k6-runner</text>
<text x="48" y="286" fill="#d4deed" font-family="sans-serif" font-size="22">Namespace: your-namespace</text>
<text x="48" y="382" fill="#a7b7cf" font-family="sans-serif" font-size="16">Illustrative example. Use your own environment values.</text>
</svg>
